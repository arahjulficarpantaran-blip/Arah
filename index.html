<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Multimedia Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <center>
        <h1>My Multimedia Page</h1>
        <hr>
    </center>

    <!-- 5 PHOTOS -->
    <div class="content">

        <h2>My five favorite images</h2>

        <img src="image1.jpg"
             alt="loyd image"
             width="170"
             height="200">

        <img src="image2.jpg"
             alt="orv image"
             width="170"
             height="200">

        <img src="images3.jpg"
             alt="mercenary"
             width="170"
             height="200">

        <img src="image4.jpg"
             alt="slime"
             width="160"
             height="200">

        <img src="image5.jpg"
             alt="windbreaker"
             width="170"
             height="200">

    </div>


    <!-- 5 AUDIO -->
    <div class="content">

        <h2>my fav songs</h2>

        <p>Kalangitan</p>
        <p>By: Guddhist Gunatita</p>
        <audio controls preload="metadata">
            <source src="Kalangitan.mp3"type="audio/mpeg">
        </audio>

        <p>Why</p>
        <p> By: bazzi</p>
        <audio controls preload="metadata">
            <source src="why.mp4" type="audio/mpeg">
        </audio>

        <p>We found love</p>
        <p>By: rihanna</p>
        <audio controls preload="metadata">
            <source src="wefoundlove.mp4" type="audio/mpeg">
        </audio>

        <p>feels</p>
        <p>By: calvin harris</p>
        <p></p>
        <audio controls preload="metadata">
            <source src="feels.mp4" type="audio/mpeg">
        </audio>

        <p>Reminder</p>
        <p>The weeknd</p>
        <audio controls preload="metadata">
            <source src="reminder.mp4" type="audio/mpeg">
        </audio>

    </div>


    <!-- 5 VIDEOS -->
    <div class="content">

        <h2>Video</h2>
        <p>New Zealand</p>
        <video controls
               width="240"
               height="500"
               preload="metadata">
            <source src="newzealand.mp4" type="video/mp4">

        </video>
        <p>Iraq</p>
        <video controls
               width="240"
               height="500"
               preload="metadata">

            <source src="iraq.mp4" type="video/mp4">

        </video>
         <p>Japan</p>
        <video controls
               width="240"
               height="500"
               preload="metadata">

            <source src="japan.mp4" type="video/mp4">

        </video>
         <p>Korea</p>
        <video controls
               width="240"
               height="400"
               preload="metadata">

            <source src="korea.mp4" type="video/mp4">

        </video>
         <p>Malaysia</p>

        <video controls
               width="240"
               height="500"
               preload="metadata">

            <source src="malaysia.mp4" type="video/mp4">

        </video>

    </div>

</body>
</html>
